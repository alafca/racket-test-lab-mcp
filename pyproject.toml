[project]
name = "racket-lab"
version = "0.1.0"
description = "Read-only MCP server exposing mock tennis racket R&D test data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2,<2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racket_lab"]
